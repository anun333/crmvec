# conda-forge recipe for crmvec (rattler-build, recipe format v1). conda-forge
# builds it from conda-forge/crmvec-feedstock, whose recipe/recipe.yaml is this
# file without these comment lines. The sha256 is the release tarball's (git
# tag v0.9.0 on anun333/crmvec).
context:
  version: "0.9.0"

package:
  name: crmvec
  version: ${{ version }}

source:
  url: https://github.com/anun333/crmvec/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 13daf752281c355097f10386d5cd7f3dfb23842dd66c3e9aa081e338ce7929cb

build:
  number: 0
  skip:
    - not linux
  script:
    - make clean
    - make lib CC="$CC"
    - make install PREFIX="$PREFIX"

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - make
  host:
    - if: aarch64
      then: simde
  run_exports:
    - ${{ pin_subpackage("crmvec", upper_bound="x.x") }}

tests:
  - package_contents:
      include:
        - crmvec.h
      files:
        - lib/crmvec/libmvec.so.1
        - if: x86_64
          then: lib/crmvec/libcrpreload.so
      bin:
        - crmvec-run
  - script:
      - crmvec-run --help
      - if: x86_64
        then: crmvec-run --libm true

about:
  homepage: https://github.com/anun333/crmvec
  repository: https://github.com/anun333/crmvec
  license: MIT
  license_file:
    - LICENSE
    - LICENSE.CORE-MATH
  summary: Correctly rounded vector math, a drop-in libmvec (and, on aarch64, libsleefgnuabi)
  description: |
    The vector functions gcc and clang call when they vectorize a loop over
    sin, exp, pow and 23 more, correctly rounded (bit for bit CORE-MATH's)
    in every rounding mode; half-precision and bfloat16 arrays. On x86-64,
    also libcrpreload.so: CORE-MATH's correctly rounded functions under the
    C library's names, for a program's scalar math (crmvec-run --libm).
    Installed in lib/crmvec, used through crmvec-run or pkg-config crmvec.

extra:
  recipe-maintainers:
    - anun333
