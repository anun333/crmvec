# crmvec's checks on every push: make check on x86-64, and natively on an
# arm64 runner (the aarch64 checker is built with SVE and is skipped on a
# CPU without it). check.log is kept as an artifact either way.
name: check
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  x86-64:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install MPFR
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libmpfr-dev
      - name: CPU
        run: nproc; grep -m1 'model name' /proc/cpuinfo; grep -o -w -E 'avx|avx2|fma|avx512f' /proc/cpuinfo | sort | uniq -c
      - name: Build
        run: make -j"$(nproc)"
      - name: make check
        run: make check
      - name: Speed of the SSE2 entry points (a shared runner, so noisy)
        run: ./bbench ./libmvec.so.1 /usr/lib/x86_64-linux-gnu/libmvec.so.1
      - name: Speed of the AVX-512 entry points, where the runner has AVX-512
        run: ./ebench ./libmvec.so.1 /usr/lib/x86_64-linux-gnu/libmvec.so.1 || echo "no AVX-512 on this runner"
      - name: The AVX-512 entry points against CORE-MATH (every float input too), where the runner has AVX-512
        run: |
          set -o pipefail
          if grep -qw avx512f /proc/cpuinfo; then ./cecheck e . 16 | tail -3; ./cecheck e . floats | tail -1; else echo "no AVX-512 on this runner"; fi
      # GitHub's x86-64 runners vary, and most lack AVX-512, so the step above
      # skipped the 512-bit core on most runs (2026-09-29). Intel SDE runs the
      # AVX-512 entry points on an emulated Skylake-SP: 2^10 calls a function
      # on a runner without AVX-512, 2^6 on one with it (checked natively
      # above; this keeps the download itself tested on every run). The
      # download is reported as a notice (with its sha256, to pin later). A
      # failed download is an error on this step but does not stop the steps
      # after it (continue-on-error): Intel's site is outside this repo.
      - name: The AVX-512 entry points under Intel SDE (Skylake-SP)
        continue-on-error: true
        run: |
          set -o pipefail
          k=10; if grep -qw avx512f /proc/cpuinfo; then k=6; echo "this runner has AVX-512 (checked natively above): SDE at 2^6 calls, to test the step"; fi
          page=https://www.intel.com/content/www/us/en/download/684897/intel-software-development-emulator.html
          ua="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
          found=$(curl -sSL --retry 2 -A "$ua" "$page" | grep -oE 'https://downloadmirror\.intel\.com/[0-9]+/sde-external-[0-9.]+-[0-9-]+-lin\.tar\.xz' | head -1 || true)
          tried=""
          for u in $found https://downloadmirror.intel.com/831748/sde-external-9.44.0-2024-08-22-lin.tar.xz \
                   https://downloadmirror.intel.com/813591/sde-external-9.33.0-2024-01-07-lin.tar.xz; do
            for a in curl "$ua"; do
              code=$(curl -sSL --retry 2 -A "$a" -o sde.tar.xz -w '%{http_code}' "$u" || true)
              tried="$tried ${code}:${a%% *}:$(basename "$u")"
              if [ "$code" = 200 ] && [ -s sde.tar.xz ]; then break 2; fi
              rm -f sde.tar.xz
            done
          done
          test -s sde.tar.xz || { echo "::error::Intel SDE could not be downloaded (page link: ${found:-none}; tried:$tried)"; exit 1; }
          echo "::notice::Intel SDE from $u, sha256 $(sha256sum sde.tar.xz | cut -c1-64)"
          mkdir sde && tar xf sde.tar.xz -C sde --strip-components=1
          sde/sde64 -skx -- ./cecheck e . $k | tail -3 | tee sde.log
          tail -1 sde.log | grep -q IDENTICAL || { echo "::error::cecheck e under SDE: $(tail -1 sde.log)"; exit 1; }
          echo "::notice::cecheck e under SDE -skx: $(tail -1 sde.log)"
      - name: The SSE2 entry points on a Core 2 and the AVX and AVX2 ones on a Sandy Bridge (qemu)
        run: |
          sudo apt-get install -y -qq qemu-user >/dev/null
          ./emu-check.sh 12 | tail -4 | tee emu.log
          test "$(grep -c 'IDENTICAL' emu.log)" -eq 3
      - name: The portable core (port/), checked and timed on this CPU (gcc and clang)
        run: |
          set -o pipefail
          gcc -O2 -ffp-contract=off -frounding-math -c -o cr_log.o log/log.c
          gcc -O2 -ffp-contract=off -frounding-math -c -o cr_exp.o exp.c
          for f in log exp; do
            gcc -O3 -ffp-contract=off -fno-math-errno -fopenmp -mavx2 -mfma -DVB=32 -o g$f port/generic-$f.c cr_$f.o -ldl -lm
            gcc -O3 -ffp-contract=off -fno-math-errno -mavx2 -mfma -DVB=32 -DGUARD -o g$f-guard port/generic-$f.c cr_$f.o -ldl -lm
            clang -O3 -ffp-contract=off -fno-math-errno -mavx2 -mfma -DVB=32 -DGUARD -o g$f-clang port/generic-$f.c cr_$f.o -ldl -lm
            ./g$f verify 4194304 | tail -1
            echo "$f (portable, with the rounding-mode check as shipped) against this library and glibc:"
            ./g$f-guard time ./libmvec.so.1 /usr/lib/x86_64-linux-gnu/libmvec.so.1
            ./g$f-clang time | sed 's/^generic/clang  /'
          done
      - name: PORT=1 (the functions in port/, built by clang), checked and timed
        run: |
          cp crtest /tmp/crtest-port0
          make clean >/dev/null && make -j"$(nproc)" PORT=1 PORTCC=clang >/dev/null
          make PORT=1 PORTCC=clang check
          echo "every portable float on all 2^32 inputs, through this build:"
          ./crtest verify expf exp2f exp10f logf log2f log10f log1pf sinf cosf tanf asinf acosf atanf expm1f coshf sinhf tanhf asinhf acoshf atanhf cbrtf erff erfcf
          ./crtest verify2 powf atan2f hypotf
          echo "the AVX2 entry points, PORT=1 (clang), then PORT=0 (crtest time; the crmvec column is the build's):"
          ./crtest time
          /tmp/crtest-port0 time
      - name: riscv64 (libsleef.so.3, LLVM's 86 SLEEF RVV names and 8 of SLEEF's own spellings), checked under qemu at VLEN 128 and 256
        run: |
          set -o pipefail
          sudo apt-get install -y -qq clang-20 gcc-riscv64-linux-gnu libc6-dev-riscv64-cross qemu-user >/dev/null
          make -j"$(nproc)" riscv64 >/dev/null
          for v in 128 256; do
            qemu-riscv64 -cpu rv64,v=true,vlen=$v build-riscv64/rv64-check 65536 | tail -3
            LD_LIBRARY_PATH=build-riscv64 qemu-riscv64 -L /usr/riscv64-linux-gnu -cpu rv64,v=true,vlen=$v build-riscv64/rv64-dropin | tail -1
          done
      - name: Keep check.log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-x86-64
          path: check.log
  arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install SIMDe
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libsimde-dev
      - name: CPU
        run: nproc; lscpu | grep -E 'Model name|Vendor'; grep -m1 -o -w -E 'sve2?' /proc/cpuinfo || echo "no SVE"
      - name: Build
        run: make -j"$(nproc)"
      - name: make check
        run: make check
      - name: Speed of the AdvSIMD entry points (a shared runner, so noisy)
        run: build-aarch64/nbench build-aarch64/libmvec.so.1 /usr/lib/aarch64-linux-gnu/libmvec.so.1
      - name: The portable core (port/), checked and timed on this CPU
        run: |
          set -o pipefail
          gcc -O2 -ffp-contract=off -frounding-math -c -o cr_log.o log/log.c
          gcc -O2 -ffp-contract=off -frounding-math -c -o cr_exp.o exp.c
          for f in log exp; do
            gcc -O3 -ffp-contract=off -fno-math-errno -fopenmp -DVB=16 -o g$f port/generic-$f.c cr_$f.o -ldl -lm
            gcc -O3 -ffp-contract=off -fno-math-errno -fopenmp -DVB=16 -march=armv8-a+sve -msve-vector-bits=128 -o g$f-sve port/generic-$f.c cr_$f.o -ldl -lm
            ./g$f verify 4194304 | tail -1
            ./g$f-sve verify 4194304 | tail -1
            echo "$f, NEON build (the libraries' AdvSIMD entry points for comparison):"
            ./g$f time build-aarch64/libmvec.so.1 /usr/lib/aarch64-linux-gnu/libmvec.so.1
            echo "$f, SVE-128 build:"
            ./g$f-sve time
          done
      - name: Every portable float on all 2^32 inputs, NEON on this CPU (port/generic-expf.c)
        run: |
          set -o pipefail
          for f in expf exp2f exp10f logf log2f log10f log1pf sinf cosf tanf asinf acosf atanf expm1f coshf sinhf tanhf asinhf acoshf atanhf cbrtf erff erfcf powf atan2f hypotf; do
            gcc -O2 -ffp-contract=off -frounding-math -c -o crf_$f.o $f.c
          done
          gcc -O3 -ffp-contract=off -fno-math-errno -fopenmp -DVB=16 -o gfloat port/generic-expf.c crf_*.o -ldl -lm
          for f in expf exp2f exp10f logf log2f log10f log1pf sinf cosf tanf asinf acosf atanf expm1f coshf sinhf tanhf asinhf acoshf atanhf cbrtf erff erfcf; do ./gfloat verify $f; done
          for f in powf atan2f hypotf; do ./gfloat verify2 16777216 $f | tail -1; done
      - name: PORT=0 (the SIMDe route, the default before 0.3.0), checked, and timed against the default
        run: |
          cp build-aarch64/libmvec.so.1 /tmp/libmvec-port1.so.1
          make clean >/dev/null && make -j"$(nproc)" PORT=0 >/dev/null
          make PORT=0 check
          echo "PORT=1 (the default) | PORT=0 | glibc, the AdvSIMD entry points (only the ported functions differ between the first two):"
          build-aarch64/nbench /tmp/libmvec-port1.so.1 build-aarch64/libmvec.so.1 /usr/lib/aarch64-linux-gnu/libmvec.so.1
      - name: Keep check.log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-arm64
          path: check.log
